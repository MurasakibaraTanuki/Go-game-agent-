name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'configs/gtp-cpu.cfg'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      MASAME_REV: 1915ecad68b0c8648fcd1b4b28228464d8454863
      NDK_VERSION: 27.2.12479018
      CMAKE_BUILD_PARALLEL_LEVEL: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out the pinned native engine recipe and notices
        uses: actions/checkout@v4
        with:
          repository: Slymaster/masame
          ref: ${{ env.MASAME_REV }}
          path: external/masame
          persist-credentials: false
      - uses: actions/cache@v4
        id: engine
        with:
          path: external/native/katago-android/arm64-v8a/libkatago.so
          key: katago-arm64-eigen-${{ env.MASAME_REV }}-${{ env.NDK_VERSION }}
      - name: Build the ARM64 KataGo executable
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -f "$ANDROID_NDK/source.properties" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          fi
          export MASAME_VENDOR="$PWD/external/native"
          bash external/masame/scripts/build-katago-android.sh
      - uses: actions/cache@v4
        id: emulator-engine
        with:
          path: external/native/katago-android/x86_64/libkatago.so
          key: katago-x86-emulator-${{ hashFiles('android/native-x86.sh') }}
      - name: Build the emulator ABI
        if: steps.emulator-engine.outputs.cache-hit != 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y libeigen3-dev
          bash android/native-x86.sh
      - name: Assemble and verify the offline APK
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GoMasters-Android
          path: |
            android/out/GoMasters-Android.apk
            android/out/SHA256SUMS
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Install and play in an offline Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          ram-size: 3072M
          disk-size: 4000M
          disable-animations: true
          script: python3 android/tests/device.py
