name: Reference tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[corpus]"
      - run: python -m unittest discover -s tests -v

  windows-game:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/play.py --setup
      - name: Check legal moves, ko and a complete 19x19 game
        shell: pwsh
        run: |
          python scripts/check_game.py --exe external/desktop/windows/katago.exe --config configs/gtp-cpu.cfg --model external/desktop/kata1-b10c128-s1141046784-d204142634.txt.gz --human-model external/desktop/b18c384nbt-humanv0.bin.gz --seed 7
      - name: Exercise the desktop controls
        shell: pwsh
        run: |
          python scripts/check_desktop.py --exe external/desktop/windows/katago.exe --config configs/gtp-cpu.cfg --model external/desktop/kata1-b10c128-s1141046784-d204142634.txt.gz --human-model external/desktop/b18c384nbt-humanv0.bin.gz --seed 7
